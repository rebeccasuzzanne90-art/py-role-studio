bio: Rebecca Wade is the founder of The Payroll Studio, with 18 years of experience across payroll operations, consulting and transformation. Her background includes leading complex payroll functions, Big Four consulting, global payroll integration and large-scale compliance and remediation programs, including three years focused on payroll compliance at Yellow Canary.
